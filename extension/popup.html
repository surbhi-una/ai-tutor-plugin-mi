<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StudyVoice</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 320px;
      padding: 20px;
      background: #0a0a0f;
      color: #e5e5e5;
      font-family: system-ui, -apple-system, sans-serif;
    }
    h3 { font-size: 16px; font-weight: 600; margin-bottom: 8px; }
    p { font-size: 12px; color: #999; margin-bottom: 12px; line-height: 1.5; }
    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      border-radius: 8px;
      background: #1a1a24;
      font-size: 13px;
      margin-bottom: 12px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }
    .dot.connected { background: #4ade80; }
    .dot.disconnected { background: #f87171; }
    input {
      width: 100%;
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid #333;
      background: #1a1a24;
      color: #e5e5e5;
      font-size: 13px;
      margin-bottom: 8px;
    }
    button {
      width: 100%;
      padding: 8px;
      border-radius: 6px;
      border: none;
      background: #4ade80;
      color: #0a0a0f;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
    }
    button:hover { opacity: 0.9; }
    .small-btn {
      background: transparent;
      border: 1px solid #333;
      color: #999;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <h3>StudyVoice</h3>

  <div class="status" id="status">
    <span class="dot disconnected" id="statusDot"></span>
    <span id="statusText">No Canvas token set</span>
  </div>

  <div id="tokenForm">
    <p>Enter your Canvas personal access token to connect.</p>
    <input type="password" id="tokenInput" placeholder="Access Token" />
    <button id="saveBtn">Save Token</button>
  </div>

  <div id="connectedView" style="display:none;">
    <p>Canvas token is saved. Navigate to any Canvas course page and click the mic button to start tutoring.</p>
    <button class="small-btn" id="clearBtn">Clear Token</button>
  </div>

  <script>
    chrome.storage.local.get(['canvasToken'], (result) => {
      if (result.canvasToken) {
        showConnected();
      }
    });

    document.getElementById('saveBtn').addEventListener('click', () => {
      const token = document.getElementById('tokenInput').value.trim();
      if (token) {
        chrome.storage.local.set({ canvasToken: token }, showConnected);
      }
    });

    document.getElementById('clearBtn').addEventListener('click', () => {
      chrome.storage.local.remove('canvasToken', showDisconnected);
    });

    function showConnected() {
      document.getElementById('statusDot').className = 'dot connected';
      document.getElementById('statusText').textContent = 'Canvas connected';
      document.getElementById('tokenForm').style.display = 'none';
      document.getElementById('connectedView').style.display = 'block';
    }

    function showDisconnected() {
      document.getElementById('statusDot').className = 'dot disconnected';
      document.getElementById('statusText').textContent = 'No Canvas token set';
      document.getElementById('tokenForm').style.display = 'block';
      document.getElementById('connectedView').style.display = 'none';
    }
  </script>
</body>
</html>
